<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅遊足跡">
    <meta name="theme-color" content="#0b0f19">
    <title>旅遊專用足跡與打卡系統</title>
    <!-- 動態生成的 iOS 主畫面圖示與網頁圖示佔位 -->
    <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="">
    <link id="faviconIcon" rel="icon" type="image/png" href="">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- exifr 完整版 EXIF / GPS 解析庫（含備援） -->
    <script id="exifrScript" src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js" onerror="loadExifrFallback()"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 1.25rem;
        }
        button, input, select {
            min-height: 56px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 1.1rem;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            transform: scale(1.3);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen px-4 py-5 font-sans">

    <div class="max-w-2xl mx-auto space-y-5">
        <!-- 品牌視覺頂部標題列（嵌入專屬徽章 Logo） -->
        <header class="bg-gradient-to-r from-slate-900 via-[#13233c] to-slate-900 border-2 border-amber-400/80 rounded-2xl p-3.5 sm:p-4 shadow-xl flex items-center justify-center gap-3.5 sm:gap-4">
            <!-- 專屬品牌 Logo SVG -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 shrink-0 rounded-2xl overflow-hidden shadow-lg border border-sky-400/40 bg-[#0F1B2D]">
                <svg id="brandLogoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="w-full h-full">
                    <defs>
                        <radialGradient id="badgeGradBC" cx="50%" cy="42%" r="60%">
                            <stop offset="0%" stop-color="#24446E"/>
                            <stop offset="68%" stop-color="#18304F"/>
                            <stop offset="100%" stop-color="#0F1B2D"/>
                        </radialGradient>
                        <linearGradient id="pinGradBC" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2EC4B6"/>
                            <stop offset="100%" stop-color="#1A9E93"/>
                        </linearGradient>
                        <linearGradient id="trailGradBC" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#63B3ED" stop-opacity="0.75"/>
                            <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9"/>
                        </linearGradient>
                        <clipPath id="badgeClipBC">
                            <circle cx="512" cy="512" r="408"/>
                        </clipPath>
                    </defs>

                    <rect width="1024" height="1024" fill="#0F1B2D"/>
                    <circle cx="512" cy="512" r="408" fill="url(#badgeGradBC)" stroke="#63B3ED" stroke-opacity="0.35" stroke-width="5"/>

                    <g clip-path="url(#badgeClipBC)" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="10">
                        <ellipse cx="512" cy="512" rx="185" ry="408"/>
                        <ellipse cx="512" cy="512" rx="320" ry="408"/>
                        <path d="M 104 345 Q 512 405 920 345"/>
                        <line x1="104" y1="512" x2="920" y2="512"/>
                        <path d="M 104 679 Q 512 619 920 679"/>
                    </g>

                    <circle cx="512" cy="512" r="384" fill="none" stroke="#90CDF4" stroke-opacity="0.22" stroke-width="10"/>

                    <path d="M 322 465
                             C 255 595, 395 725, 495 660
                             C 585 600, 610 545, 685 715"
                          fill="none"
                          stroke="url(#trailGradBC)"
                          stroke-width="20"
                          stroke-linecap="round"
                          stroke-dasharray="34 26"/>

                    <!-- 左上青綠地圖釘 -->
                    <g transform="translate(332, 305) rotate(10) scale(0.92)">
                        <path d="M 0 -145
                                 C 74 -145, 130 -88, 130 -16
                                 C 130 66, 24 136, 0 176
                                 C -24 136, -130 66, -130 -16
                                 C -130 -88, -74 -145, 0 -145 Z"
                              fill="url(#pinGradBC)"/>
                        <circle cx="0" cy="-22" r="44" fill="#FFFFFF"/>
                    </g>

                    <!-- 後腳（放大 1.5 倍） -->
                    <g transform="translate(386, 656) rotate(28) scale(1.08)">
                        <path d="M -42 -24
                                 C -48 -82 42 -82 44 -22
                                 C 46 22 28 48 32 82
                                 C 36 116 -32 116 -30 80
                                 C -28 44 -36 16 -42 -24 Z"
                              fill="#FF6B4A"/>
                        <ellipse cx="-28" cy="-102" rx="15" ry="20" transform="rotate(-12 -28 -102)" fill="#E85535"/>
                        <ellipse cx="-4" cy="-112" rx="11" ry="15" transform="rotate(-4 -4 -112)" fill="#E85535"/>
                        <ellipse cx="18" cy="-106" rx="9" ry="13" transform="rotate(6 18 -106)" fill="#E85535"/>
                        <ellipse cx="37" cy="-92" rx="8" ry="11" transform="rotate(15 37 -92)" fill="#E85535"/>
                    </g>

                    <!-- 前腳（放大 1.5 倍，間距拉開） -->
                    <g transform="translate(612, 492) rotate(48) scale(1.08)">
                        <path d="M -42 -22
                                 C -44 -80 44 -80 40 -20
                                 C 36 22 30 48 32 82
                                 C 34 116 -32 116 -28 80
                                 C -24 44 -38 16 -42 -22 Z"
                              fill="#FF6B4A"/>
                        <ellipse cx="-37" cy="-92" rx="8" ry="11" transform="rotate(-15 -37 -92)" fill="#E85535"/>
                        <ellipse cx="-18" cy="-106" rx="9" ry="13" transform="rotate(-6 -18 -106)" fill="#E85535"/>
                        <ellipse cx="4" cy="-112" rx="11" ry="15" transform="rotate(4 4 -112)" fill="#E85535"/>
                        <ellipse cx="28" cy="-102" rx="15" ry="20" transform="rotate(12 28 -102)" fill="#E85535"/>
                    </g>

                    <!-- 右下確認對勾 -->
                    <g transform="translate(718, 724) scale(0.92)">
                        <path d="M -42 8 L -4 46 L 82 -44"
                              fill="none"
                              stroke="#B45309"
                              stroke-width="46"
                              stroke-linecap="round"
                              stroke-linejoin="round"/>
                        <path d="M -42 8 L -4 46 L 82 -44"
                              fill="none"
                              stroke="#FFD166"
                              stroke-width="32"
                              stroke-linecap="round"
                              stroke-linejoin="round"/>
                    </g>
                </svg>
            </div>

            <!-- 標題與副標 -->
            <div class="text-left">
                <h1 class="text-2xl sm:text-3xl font-black text-amber-300 tracking-wide leading-tight">
                    旅遊足跡與打卡系統
                </h1>
                <p class="text-sm sm:text-base text-sky-300/90 font-bold mt-0.5">
                    足跡所至・平安相伴
                </p>
            </div>
        </header>

        <!-- 模式切換分頁按鈕 -->
        <div class="grid grid-cols-2 gap-3 bg-slate-900 p-2 rounded-2xl border-2 border-slate-700 shadow-lg">
            <button id="tabLiveBtn" onclick="switchMode('live')" class="bg-blue-600 text-white text-lg sm:text-xl font-black py-3 px-3 rounded-xl border-2 border-blue-300 shadow transition-all">
                📡 即時現場打卡
            </button>
            <button id="tabRetroBtn" onclick="switchMode('retro')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-lg sm:text-xl font-black py-3 px-3 rounded-xl border-2 border-transparent transition-all">
                🕰️ 事後回憶補登
            </button>
        </div>

        <!-- 【模式一】即時現場 GPS 定位與打卡核心區塊 -->
        <section id="liveCheckInSection" class="bg-slate-900 border-2 border-blue-400/60 rounded-2xl p-4 shadow-xl space-y-4">
            <div>
                <button onclick="getGPSLocation()" id="gpsBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-black py-4 px-4 rounded-xl shadow-md border-2 border-blue-300 flex items-center justify-center gap-2 whitespace-nowrap transition-transform active:scale-95">
                    📡 開啟 GPS 並取得目前位置
                </button>
                <div id="gpsStatus" class="mt-3 text-lg sm:text-xl text-amber-300 font-bold bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                    ⚠️ 尚未取得 GPS 定位
                </div>
            </div>

            <!-- 新增打卡欄位 -->
            <div class="pt-3 border-t border-slate-800 space-y-3">
                <h2 class="text-lg sm:text-xl font-bold text-cyan-300">
                    ✍️ 新增旅遊駐點打卡
                </h2>
                <div>
                    <input type="text" id="locDesc" placeholder="請輸入景點名稱或說明..." class="w-full bg-slate-950 text-white border-2 border-amber-400/80 rounded-xl p-3 text-xl placeholder-slate-500 focus:outline-none">
                </div>
                <div>
                    <button onclick="saveCheckIn()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xl font-black py-4 px-4 rounded-xl shadow-md border-2 border-emerald-300 flex items-center justify-center gap-2 whitespace-nowrap transition-transform active:scale-95">
                        💾 儲存目前位置打卡
                    </button>
                </div>
            </div>
        </section>

        <!-- 【模式二】事後回憶補登專屬區塊 -->
        <section id="retroCheckInSection" class="hidden bg-slate-900 border-2 border-amber-400/80 rounded-2xl p-4 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h2 class="text-xl font-black text-amber-300">
                    🕰️ 事後回憶駐點補登
                </h2>
                <span class="text-xs bg-amber-950 text-amber-300 px-2.5 py-1 rounded-lg border border-amber-500/50">自動依時間排序</span>
            </div>

            <!-- 來源 1：上傳照片自動提取 EXIF -->
            <div class="bg-slate-950 p-3.5 rounded-xl border border-cyan-500/50 space-y-2">
                <div class="text-base font-bold text-cyan-300">
                    📷 方法 A：選取當時照片自動讀取時間與 GPS
                </div>
                <button onclick="triggerPhotoExif()" class="w-full bg-cyan-700 hover:bg-cyan-600 text-white text-lg font-black py-3 px-4 rounded-xl border-2 border-cyan-400 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    🖼️ 從手機相簿選擇照片提取資訊
                </button>
                <input type="file" id="photoExifInput" accept="image/*,.heic,.heif" class="hidden" onchange="handlePhotoExif(event)">
                <div id="exifStatus" class="text-sm text-slate-400 text-center leading-relaxed">
                    支援 iPhone / Android 含定位資訊之原始照片（選照片時請確認「選項 → 位置」已開啟）
                </div>
            </div>

            <!-- 來源 2：地圖點擊選點 或 貼上 Google 地圖連結 -->
            <div class="bg-slate-950 p-3.5 rounded-xl border border-purple-500/50 space-y-3">
                <div class="text-base font-bold text-purple-300">
                    🗺️ 方法 B：無照片或無 GPS 時手動指定座標
                </div>
                <button id="mapPickToggleBtn" onclick="toggleMapPickMode()" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-lg font-black py-3 px-4 rounded-xl border-2 border-purple-400 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    📍 開啟「點擊下方地圖選點」模式
                </button>
                <div class="flex gap-2">
                    <input type="text" id="gmapsUrlInput" placeholder="或貼上 Google 地圖網址 / 經緯度..." class="flex-1 bg-slate-900 text-white border border-slate-600 rounded-xl px-3 text-base placeholder-slate-500 focus:outline-none focus:border-purple-400">
                    <button onclick="parseLocationInput()" class="bg-slate-700 hover:bg-slate-600 text-amber-300 font-bold px-4 rounded-xl border border-slate-500 text-base whitespace-nowrap">
                        解析座標
                    </button>
                </div>
            </div>

            <!-- 補登資料確認表單 -->
            <div class="space-y-3 pt-2 border-t border-slate-800">
                <div>
                    <label for="retroDateTime" class="block text-base font-bold text-amber-200 mb-1">
                        📅 當時抵達的日期與時間：
                    </label>
                    <input type="datetime-local" id="retroDateTime" class="w-full bg-slate-950 text-white border-2 border-amber-400/70 rounded-xl p-3 text-lg focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="retroLat" class="block text-sm font-bold text-slate-300 mb-1">緯度 (Lat)</label>
                        <input type="number" step="any" id="retroLat" placeholder="例如 22.6273" onchange="previewRetroOnMap()" class="w-full bg-slate-950 text-cyan-300 font-mono border border-slate-600 rounded-xl p-3 text-base focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label for="retroLng" class="block text-sm font-bold text-slate-300 mb-1">經度 (Lng)</label>
                        <input type="number" step="any" id="retroLng" placeholder="例如 120.3014" onchange="previewRetroOnMap()" class="w-full bg-slate-950 text-cyan-300 font-mono border border-slate-600 rounded-xl p-3 text-base focus:outline-none focus:border-cyan-400">
                    </div>
                </div>

                <div>
                    <label for="retroDesc" class="block text-base font-bold text-amber-200 mb-1">
                        ✍️ 景點名稱與回憶亮點：
                    </label>
                    <input type="text" id="retroDesc" placeholder="例如：白川鄉合掌村展望台（雪景超美）" class="w-full bg-slate-950 text-white border-2 border-amber-400/80 rounded-xl p-3 text-xl placeholder-slate-500 focus:outline-none">
                </div>

                <button onclick="saveRetroCheckIn()" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xl font-black py-4 px-4 rounded-xl shadow-md border-2 border-amber-300 flex items-center justify-center gap-2 whitespace-nowrap transition-transform active:scale-95">
                    🕰️ 儲存事後回憶補登
                </button>
            </div>
        </section>

        <!-- 選擇打卡駐點足跡與出發導航按鈕並排 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-end">
            <div class="bg-white text-gray-900 rounded-2xl p-4 shadow-xl border-2 border-slate-300 h-full flex flex-col justify-between">
                <label for="locationSelect" class="block text-lg font-bold mb-2">
                    📍 選擇打卡駐點足跡：
                </label>
                <select id="locationSelect" onchange="onSelectLocationChange()" class="w-full bg-slate-50 text-blue-700 font-bold border-2 border-blue-400 rounded-xl p-3 text-lg focus:outline-none">
                </select>
            </div>

            <div class="h-full flex items-end">
                <a id="navGoBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-base sm:text-lg font-black py-4 px-4 rounded-2xl shadow-xl border-2 border-emerald-300 flex items-center justify-center gap-2 text-center whitespace-nowrap transition-transform active:scale-95 h-full">
                    🚗 出發導航 (開啟 Google 地圖)
                </a>
            </div>
        </div>

        <!-- 目標距離顯示 -->
        <div class="bg-emerald-950/80 text-emerald-200 rounded-2xl p-3 shadow-md border-2 border-emerald-500/60 space-y-1 text-center">
            <div class="text-base font-bold text-emerald-300">
                📍 您與目標位置距離：
            </div>
            <div id="targetDistance" class="text-2xl sm:text-3xl font-black text-emerald-400 tracking-wider">
                -- 公里
            </div>
        </div>

        <!-- 地圖點擊選點提示條 -->
        <div id="mapPickBanner" class="hidden bg-purple-700 text-white text-center font-black py-3 px-4 rounded-xl border-2 border-purple-300 animate-pulse">
            👆 請直接點擊下方地圖上的位置來抓取座標！
        </div>

        <!-- 地圖顯示區域 -->
        <div class="w-full h-[65vh] rounded-2xl overflow-hidden shadow-xl border-2 border-slate-700 z-0">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- 報平安與備份小工具區塊 -->
        <section class="bg-slate-900 border-2 border-amber-400/60 rounded-2xl p-4 shadow-xl space-y-4">
            <h2 class="text-lg sm:text-xl font-bold text-amber-300">
                🛠️ 旅遊便利小工具
            </h2>
            
            <div class="bg-slate-950 p-3 rounded-xl border border-amber-500/40 space-y-2">
                <label for="reportDaysSelect" class="block text-base font-bold text-amber-200">
                    📋 選擇 LINE 報平安包含的天數範圍：
                </label>
                <select id="reportDaysSelect" class="w-full bg-slate-900 text-amber-300 font-bold border-2 border-amber-400 rounded-xl p-3 text-lg focus:outline-none">
                    <option value="2" selected>最近 2 天內的打卡行程 (預設)</option>
                    <option value="1">最近 1 天 (僅今天)</option>
                    <option value="3">最近 3 天內的打卡行程</option>
                    <option value="all">所有歷史打卡紀錄</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="copyLineReport()" class="bg-amber-600 hover:bg-amber-500 text-white text-lg font-bold py-3 px-3 rounded-xl shadow border border-amber-300 flex items-center justify-center gap-2 whitespace-nowrap">
                    📋 複製 LINE 報平安
                </button>
                <button onclick="exportBackup()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-3 px-3 rounded-xl shadow border border-indigo-300 flex items-center justify-center gap-2 whitespace-nowrap">
                    📤 備份回憶 (存雲端/iCloud)
                </button>
                <button onclick="triggerImport()" class="bg-violet-600 hover:bg-violet-500 text-white text-lg font-bold py-3 px-3 rounded-xl shadow border border-violet-300 flex items-center justify-center gap-2 whitespace-nowrap sm:col-span-2">
                    📥 還原備份資料
                </button>
                <input type="file" id="importFile" accept=".json,application/json,text/plain" class="hidden" onchange="importBackup(event)">
            </div>
        </section>

        <!-- 所有打卡紀錄清單管理 -->
        <section class="bg-slate-900 border-2 border-purple-400/60 rounded-2xl p-4 shadow-xl space-y-4">
            <button onclick="toggleHistoryWarehouse()" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-lg sm:text-xl font-bold py-3 px-4 rounded-xl shadow-md border border-purple-300 flex items-center justify-between whitespace-nowrap">
                <span>📦 詳細打卡紀錄列表</span>
                <span id="warehouseToggleText" class="text-amber-300">[ 展開 🔽 ]</span>
            </button>
            
            <div id="historyWarehouseContainer" class="hidden space-y-3 pt-3 border-t border-purple-900">
                <div id="allRecordList" class="space-y-3">
                </div>
            </div>
        </section>

        <!-- 彈窗與二次確認 -->
        <div id="msgModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl p-6 max-w-md w-full text-center shadow-2xl">
                <p id="msgText" class="text-xl font-bold text-amber-300 mb-6 whitespace-pre-line"></p>
                <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xl font-black py-3 rounded-xl shadow-lg border border-emerald-400">
                    確定知道了 👍
                </button>
            </div>
        </div>

        <div id="deleteModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border-2 border-rose-500 rounded-2xl p-6 max-w-md w-full text-center shadow-2xl space-y-6">
                <p class="text-xl font-bold text-rose-300">⚠️ 請問確定要刪除這筆回憶紀錄嗎？</p>
                <div class="flex gap-4">
                    <button onclick="closeDeleteModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-lg font-bold py-3 rounded-xl shadow-lg border border-slate-500">
                        取消
                    </button>
                    <button id="confirmDeleteBtn" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-lg font-bold py-3 rounded-xl shadow-lg border border-rose-400">
                        確定刪除 🗑️
                    </button>
                </div>
            </div>
        </div>

        <!-- 精緻品牌頁尾 -->
        <footer class="text-center text-slate-400 text-base pb-8 pt-2 flex items-center justify-center gap-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-teal-400"></span>
            <p>專為旅遊設計的安心足跡紀錄系統</p>
        </footer>
    </div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let allRecords = [];
        let pendingDeleteIndex = null;
        let map = null;
        let mapMarker = null;
        let isMapPickMode = false;
        let exifrFallbackTried = false;

        function loadExifrFallback() {
            if (exifrFallbackTried) return;
            exifrFallbackTried = true;
            const fallback = document.createElement('script');
            fallback.src = "https://unpkg.com/exifr/dist/full.umd.js";
            document.head.appendChild(fallback);
        }

        // 自動將頁面上的 SVG Logo 渲染成 180x180 PNG，供 iPhone「加入主畫面」與瀏覽器分頁圖示使用
        function generateAppIconsFromSvg() {
            try {
                const svgEl = document.getElementById('brandLogoSvg');
                if (!svgEl) return;
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(svgEl);
                const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 180;
                    canvas.height = 180;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 180, 180);

                    const pngDataUrl = canvas.toDataURL('image/png');
                    const appleIcon = document.getElementById('appleTouchIcon');
                    const favIcon = document.getElementById('faviconIcon');
                    if (appleIcon) appleIcon.href = pngDataUrl;
                    if (favIcon) favIcon.href = pngDataUrl;

                    URL.revokeObjectURL(url);
                };
                img.src = url;
            } catch (e) {
                console.log("產生主畫面圖示略過", e);
            }
        }

        async function handlePhotoExif(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('exifStatus');
            const fileSizeKB = (file.size / 1024).toFixed(0);
            statusEl.innerHTML = `<span class="animate-spin-custom">⏳</span> 正在分析照片（${escapeHtml(file.name)}，${fileSizeKB} KB）...`;

            if (typeof exifr === 'undefined') {
                const reason = "EXIF 解析元件尚未載入完成（可能是網路連線或擋廣告外掛阻擋 CDN）。";
                statusEl.innerHTML = `<span class="text-rose-400 font-bold">❌ ${reason}</span>`;
                showModal(`❌ 照片解析失敗\n\n原因：${reason}\n建議：請重新整理網頁，或直接點選「📍 開啟點擊下方地圖選點模式」。`);
                event.target.value = '';
                return;
            }

            if (!file.size || file.size < 100) {
                const reason = "選取的檔案大小異常或為空檔案。";
                statusEl.innerHTML = `<span class="text-rose-400 font-bold">❌ ${reason}</span>`;
                showModal(`❌ 照片解析失敗\n\n原因：${reason}`);
                event.target.value = '';
                return;
            }

            let gpsData = null;
            let metaData = null;
            let gpsErr = null;
            let metaErr = null;

            try {
                gpsData = await exifr.gps(file);
            } catch (e) {
                gpsErr = e?.message || String(e);
            }

            try {
                metaData = await exifr.parse(file, {
                    pick: ['DateTimeOriginal', 'CreateDate', 'ModifyDate', 'GPSLatitude', 'GPSLongitude'],
                    gps: true
                });
            } catch (e) {
                metaErr = e?.message || String(e);
            }

            let foundTime = false;
            const rawDate = metaData?.DateTimeOriginal || metaData?.CreateDate || metaData?.ModifyDate;
            if (rawDate) {
                const d = new Date(rawDate);
                if (!isNaN(d.getTime())) {
                    const offset = d.getTimezoneOffset() * 60000;
                    const localISO = (new Date(d - offset)).toISOString().slice(0, 16);
                    document.getElementById('retroDateTime').value = localISO;
                    foundTime = true;
                }
            }

            let lat = null;
            let lng = null;
            if (gpsData && typeof gpsData.latitude === 'number' && typeof gpsData.longitude === 'number') {
                lat = Number(gpsData.latitude.toFixed(6));
                lng = Number(gpsData.longitude.toFixed(6));
            } else if (metaData && typeof metaData.latitude === 'number' && typeof metaData.longitude === 'number') {
                lat = Number(metaData.latitude.toFixed(6));
                lng = Number(metaData.longitude.toFixed(6));
            }

            const foundGps = (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng));
            if (foundGps) {
                document.getElementById('retroLat').value = lat;
                document.getElementById('retroLng').value = lng;
                previewRetroOnMap();
            }

            if (foundGps && foundTime) {
                statusEl.innerHTML = `<span class="text-emerald-400 font-bold">✅ 成功提取「拍攝時間」與「GPS 座標」（${lat}, ${lng}）！</span>`;
                showModal(`📷 照片定位提取成功！\n\n已自動帶入：\n• 拍攝時間\n• 座標：${lat}, ${lng}\n\n請輸入景點名稱並按「儲存事後回憶補登」。`);
                document.getElementById('retroDesc').focus();
            } else if (foundTime && !foundGps) {
                const detail = gpsErr
                    ? `解析 GPS 時發生錯誤（${gpsErr}），可能是 HEIC 格式在目前瀏覽器受限。`
                    : "這張照片檔案內沒有 GPS 經緯度資料（可能拍照時在室內/無定位、從 LINE 轉傳被移除定位，或選照片時「選項 → 位置」未開啟）。";
                statusEl.innerHTML = `<span class="text-amber-300 font-bold">⚠️ 已帶入照片時間，但無 GPS 座標。</span><br><span class="text-xs text-slate-300">${escapeHtml(detail)}</span>`;
                showModal(`⚠️ 已帶入照片時間，但未取得 GPS 座標\n\n原因：${detail}\n\n解法：請點選「📍 開啟點擊下方地圖選點模式」，直接在下方地圖點選位置即可補齊！`);
            } else if (!foundTime && foundGps) {
                const detail = metaErr ? `讀取日期標籤失敗（${metaErr}）` : "照片未記錄原始拍攝日期時間，已保留目前選擇的日期時間。";
                statusEl.innerHTML = `<span class="text-emerald-300 font-bold">✅ 已帶入 GPS 座標（${lat}, ${lng}），但未抓到拍攝時間。</span><br><span class="text-xs text-slate-300">${escapeHtml(detail)}</span>`;
                showModal(`✅ 已帶入 GPS 座標（${lat}, ${lng}）\n\n提醒：${detail} 請確認上方「當時抵達的日期與時間」是否正確。`);
            } else {
                const techReason = (gpsErr || metaErr)
                    ? `格式解析錯誤（${gpsErr || metaErr}）。`
                    : "照片中找不到 EXIF 拍攝時間與 GPS 定位資料（常見於通訊軟體下載圖、螢幕截圖，或 iPhone 選取照片時未勾選「位置」）。";
                statusEl.innerHTML = `<span class="text-rose-400 font-bold">❌ 無法從照片自動提取時間與座標。</span><br><span class="text-xs text-slate-300">${escapeHtml(techReason)}</span>`;
                showModal(`❌ 照片自動定位失敗\n\n原因：${techReason}\n\n建議做法：\n1. 在 iPhone「照片」App 點開該照片按 (i) 確認是否有地點\n2. 選照片時確認「選項 → 位置」已開啟\n3. 或直接點選「📍 開啟點擊下方地圖選點模式」手動選點`);
            }

            event.target.value = '';
        }

        function parseLocationInput() {
            const raw = document.getElementById('gmapsUrlInput').value.trim();
            if (!raw) {
                showModal("請先貼上 Google 地圖網址或經緯度（例如 22.6273, 120.3014）！");
                return;
            }

            const regex = /(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/;
            const match = raw.match(regex);

            if (match) {
                const lat = Number(parseFloat(match[1]).toFixed(6));
                const lng = Number(parseFloat(match[2]).toFixed(6));
                if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                    document.getElementById('retroLat').value = lat;
                    document.getElementById('retroLng').value = lng;
                    previewRetroOnMap();
                    showModal(`✅ 成功解析座標！\n緯度: ${lat}, 經度: ${lng}`);
                    return;
                }
            }
            showModal("❌ 無法從文字中辨識經緯度！\n提示：如果是短網址（maps.app.goo.gl），請在瀏覽器打開後複製完整網址，或直接使用「點擊地圖選點」。");
        }

        function previewRetroOnMap() {
            const lat = parseFloat(document.getElementById('retroLat').value);
            const lng = parseFloat(document.getElementById('retroLng').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 16);
                if (mapMarker) map.removeLayer(mapMarker);
                mapMarker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`🕰️ 預覽補登位置<br>${lat}, ${lng}`)
                    .openPopup();
            }
        }

        function saveRetroCheckIn() {
            const dtVal = document.getElementById('retroDateTime').value;
            const lat = parseFloat(document.getElementById('retroLat').value);
            const lng = parseFloat(document.getElementById('retroLng').value);
            const desc = document.getElementById('retroDesc').value.trim();

            if (!dtVal) {
                showModal("請選擇當時抵達的日期與時間！");
                return;
            }
            if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                showModal("請先透過「照片讀取」、「地圖點擊選點」或「解析網址」取得正確的經緯度座標！");
                return;
            }
            if (!desc) {
                showModal("請輸入景點名稱或回憶亮點！");
                document.getElementById('retroDesc').focus();
                return;
            }

            const dateObj = new Date(dtVal);
            if (isNaN(dateObj.getTime())) {
                showModal("日期時間格式不正確，請重新選擇！");
                return;
            }

            const now = new Date();
            const yearPrefix = (dateObj.getFullYear() !== now.getFullYear()) ? `${dateObj.getFullYear()}/` : "";
            const timeString = `${yearPrefix}${dateObj.getMonth()+1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

            const retroRecord = {
                id: Date.now(),
                desc: desc,
                lat: lat,
                lng: lng,
                time: timeString,
                timestamp: dateObj.getTime(),
                isRetro: true
            };

            allRecords.push(retroRecord);
            allRecords.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            saveData();
            updateDropdownAndMap();
            renderRecordList();

            const insertedIdx = allRecords.findIndex(r => r.id === retroRecord.id);
            if (insertedIdx !== -1) {
                document.getElementById('locationSelect').value = insertedIdx;
                onSelectLocationChange();
            }

            document.getElementById('retroDesc').value = '';
            document.getElementById('retroLat').value = '';
            document.getElementById('retroLng').value = '';
            document.getElementById('gmapsUrlInput').value = '';
            document.getElementById('exifStatus').innerText = '支援 iPhone / Android 含定位資訊之原始照片（選照片時請確認「選項 → 位置」已開啟）';

            showModal("🎉 回憶補登成功！已自動依日期時間順序排入足跡清單！");
        }

        function showModal(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('senior_travel_all_records');
                if (saved) {
                    allRecords = JSON.parse(saved);
                } else {
                    const oldLatest = localStorage.getItem('senior_travel_latest');
                    const oldHistory = localStorage.getItem('senior_travel_history');
                    let temp = [];
                    if (oldLatest) temp = temp.concat(JSON.parse(oldLatest));
                    if (oldHistory) temp = temp.concat(JSON.parse(oldHistory));
                    if (temp.length > 0) allRecords = temp;
                }
            } catch (e) {
                console.error("載入資料失敗", e);
            }
            updateDropdownAndMap();
            renderRecordList();
        }

        function saveData() {
            try {
                localStorage.setItem('senior_travel_all_records', JSON.stringify(allRecords));
            } catch (e) {
                console.error("儲存資料失敗", e);
            }
        }

        function updateDropdownAndMap() {
            const selectEl = document.getElementById('locationSelect');
            selectEl.innerHTML = '';

            if (allRecords.length === 0) {
                const option = document.createElement('option');
                option.text = "⚠️ 尚未有打卡駐點紀錄";
                option.value = "";
                selectEl.add(option);
                document.getElementById('targetDistance').innerText = "-- 公里";
                document.getElementById('navGoBtn').href = "#";
                return;
            }

            allRecords.forEach((item, index) => {
                const option = document.createElement('option');
                const isLatest = (index === 0) ? "【最新】" : "";
                const retroTag = item.isRetro ? "[補登]" : "";
                option.text = `📍 ${isLatest}${retroTag} ${item.desc} (${item.time})`;
                option.value = index;
                selectEl.add(option);
            });

            selectEl.selectedIndex = 0;
            onSelectLocationChange();
        }

        function onSelectLocationChange() {
            const selectEl = document.getElementById('locationSelect');
            const idx = selectEl.value;

            if (idx === "" || !allRecords[idx]) return;

            const selected = allRecords[idx];
            const lat = selected.lat;
            const lng = selected.lng;
            map.setView([lat, lng], 16);

            if (mapMarker) {
                map.removeLayer(mapMarker);
            }
            const tag = selected.isRetro ? "🕰️ 回憶補登：" : "📍 駐點位置：";
            mapMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`${tag}${selected.desc}<br><small>${selected.time}</small>`)
                .openPopup();

            document.getElementById('navGoBtn').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            updateDistanceDisplay(lat, lng);
            setTimeout(() => { map.invalidateSize(); }, 150);
        }

        function updateDistanceDisplay(targetLat, targetLng) {
            const distSpan = document.getElementById('targetDistance');
            if (currentLat !== null && currentLng !== null) {
                const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
                if (dist !== null) {
                    if (dist < 1) {
                        distSpan.innerText = `${(dist * 1000).toFixed(0)} 公尺`;
                    } else {
                        distSpan.innerText = `${dist.toFixed(2)} 公里`;
                    }
                }
            } else {
                distSpan.innerText = "尚未取得 GPS 定位";
            }
        }

        function getGPSLocation() {
            const statusDiv = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                statusDiv.innerHTML = "❌ 您的瀏覽器不支援 GPS 定位";
                showModal("您的瀏覽器不支援 GPS 定位功能！");
                return;
            }

            statusDiv.innerHTML = `<span class="animate-spin-custom">📡</span> 正在搜尋衛星定位中，請稍候...`;
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    statusDiv.innerHTML = `✅ 已成功取得定位！<br><span class="text-sm text-slate-300">緯度: ${currentLat.toFixed(4)}, 經度: ${currentLng.toFixed(4)}</span>`;
                    onSelectLocationChange();
                },
                (error) => {
                    console.error(error);
                    statusDiv.innerHTML = "❌ 無法取得 GPS 位置，請確認手機定位已開啟";
                    showModal("無法取得 GPS 位置！請檢查手機是否已授權瀏覽器存取定位。");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function saveCheckIn() {
            const descInput = document.getElementById('locDesc');
            const desc = descInput.value.trim();

            if (currentLat === null || currentLng === null) {
                showModal("請先點擊上方的「開啟 GPS 並取得目前位置」！");
                return;
            }

            if (!desc) {
                showModal("請輸入位置說明（例如：杉林衛生所）！");
                descInput.focus();
                return;
            }

            const now = new Date();
            const timeString = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newRecord = {
                id: Date.now(),
                desc: desc,
                lat: currentLat,
                lng: currentLng,
                time: timeString,
                timestamp: now.getTime(),
                isRetro: false
            };

            allRecords.unshift(newRecord);
            allRecords.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            saveData();
            updateDropdownAndMap();
            renderRecordList();
            descInput.value = '';
            showModal("🎉 打卡成功！最新駐點已更新！");
        }

        function renderRecordList() {
            const container = document.getElementById('allRecordList');
            if (allRecords.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-950 rounded-xl text-center text-slate-400 text-lg">目前尚無歷史紀錄。</div>`;
                return;
            }

            container.innerHTML = allRecords.map((item, index) => {
                const retroBadge = item.isRetro 
                    ? `<span class="text-xs bg-amber-950 text-amber-300 px-2 py-0.5 rounded border border-amber-500/60 ml-1">🕰️ 補登</span>` 
                    : "";
                return `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 shadow">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-lg font-bold text-amber-300">📌 ${escapeHtml(item.desc)}${retroBadge}</h3>
                            <span class="text-xs bg-slate-900 text-cyan-300 px-2 py-1 rounded-lg border border-cyan-800 whitespace-nowrap">${item.time}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="selectAndFocusMap(${index})" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white text-base font-bold py-2.5 px-3 rounded-lg text-center border border-cyan-400 shadow whitespace-nowrap">
                                🗺️ 地圖定位
                            </button>
                            <button onclick="confirmDeleteRecord(${index})" class="bg-rose-700 hover:bg-rose-600 text-white text-base font-bold py-2.5 px-3 rounded-lg border border-rose-400 shadow whitespace-nowrap">
                                🗑️ 刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectAndFocusMap(index) {
            document.getElementById('locationSelect').value = index;
            onSelectLocationChange();
            document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function confirmDeleteRecord(index) {
            pendingDeleteIndex = index;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteIndex = null;
        }

        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (pendingDeleteIndex !== null) {
                allRecords.splice(pendingDeleteIndex, 1);
                saveData();
                updateDropdownAndMap();
                renderRecordList();
                showModal("🗑️ 該筆紀錄已刪除！");
            }
            closeDeleteModal();
        };

        function copyLineReport() {
            if (allRecords.length === 0) {
                showModal("目前沒有任何打卡紀錄可以複製！");
                return;
            }

            const daysVal = document.getElementById('reportDaysSelect').value;
            let filteredItems = allRecords;

            if (daysVal !== 'all') {
                const daysLimit = parseInt(daysVal, 10);
                const nowTime = new Date().getTime();
                const limitMillis = daysLimit * 24 * 60 * 60 * 1000;

                filteredItems = allRecords.filter(item => {
                    if (!item.timestamp) return true; 
                    return (nowTime - item.timestamp) <= limitMillis;
                });
            }

            if (filteredItems.length === 0) {
                showModal(`所選的時間範圍（最近 ${daysVal} 天內）沒有任何打卡紀錄！`);
                return;
            }

            let reportText = `📍【旅遊平安回報與足跡】(最近 ${daysVal === 'all' ? '所有' : daysVal + '天'} )\n`;
            filteredItems.forEach((item, idx) => {
                const tag = item.isRetro ? "[補登] " : "";
                reportText += `${idx + 1}. ${tag}${item.desc} (${item.time})\n`;
                reportText += `   導航：https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}\n`;
            });
            reportText += "家人們不用擔心，我目前平安順利！❤️";

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(reportText).then(() => {
                    showModal(`📋 已成功複製報平安足跡文字（共 ${filteredItems.length} 筆）！可以直接貼到 LINE 傳給家人！`);
                });
            }
        }

        async function exportBackup() {
            if (allRecords.length === 0) {
                showModal("目前沒有任何紀錄可以備份喔！");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
            const fileName = `travel_footprint_backup_${dateStr}.json`;
            const jsonString = JSON.stringify(allRecords, null, 2);

            try {
                const file = new File([jsonString], fileName, { type: "application/json" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: '旅遊足跡備份資料',
                        text: '請選擇「儲存到檔案 (iCloud)」或傳送到雲端保存'
                    });
                    return;
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.log("改用一般下載模式", err);
            }

            const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showModal(`📤 備份檔案（${fileName}）已下載到手機的「下載」資料夾！`);
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        allRecords = parsed;
                    } else if (parsed.latestRecords) {
                        allRecords = [...parsed.latestRecords, ...parsed.historyRecords];
                    }
                    allRecords.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    saveData();
                    updateDropdownAndMap();
                    renderRecordList();
                    showModal("📥 備份資料還原成功！");
                } catch (err) {
                    showModal("❌ 解析備份檔案失敗！");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function toggleHistoryWarehouse() {
            const container = document.getElementById('historyWarehouseContainer');
            const toggleText = document.getElementById('warehouseToggleText');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                toggleText.innerText = '[ 收合 🔼 ]';
            } else {
                container.classList.add('hidden');
                toggleText.innerText = '[ 展開 🔽 ]';
            }
        }
    </script>
