<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>旅遊駐點足跡與打卡系統</title>

    <!-- iOS / Apple Web App 優化設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅遊足跡">
    <!-- 解決 iPhone 主畫面預設圖示問題：設定專用 Apple Touch Icon (SVG 轉 Data URL) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M50 20C36.2 20 25 31.2 25 45c0 18.8 25 35 25 35s25-16.2 25-35c0-13.8-11.2-25-25-25zm0 33.8c-4.8 0-8.8-3.9-8.8-8.8s3.9-8.8 8.8-8.8 8.8 3.9 8.8 8.8-3.9 8.8-8.8 8.8z' fill='%23f59e0b'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-size: 1.125rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        button, input, select {
            min-height: 52px;
        }

        /* 蘋果風格毛玻璃質感卡片 */
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        /* 地圖邊框質感 */
        .map-container {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        /* 地圖氣泡客製化 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2937 !important;
            color: #f9fafb !important;
            font-weight: 600;
            font-size: 1.05rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .leaflet-popup-content {
            margin: 14px 18px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen px-4 py-6">

    <div class="max-w-2xl mx-auto space-y-5">
        
        <!-- 標題卡片 -->
        <header class="glass-card rounded-3xl p-5 text-center relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-500 whitespace-nowrap overflow-hidden text-ellipsis drop-shadow-sm">
                📍 旅遊駐點足跡與打卡系統
            </h1>
        </header>

        <!-- GPS 定位區塊 -->
        <section class="glass-card rounded-3xl p-5 space-y-3">
            <div>
                <button onclick="getGPSLocation()" id="gpsBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] transition-all text-white text-lg sm:text-xl font-bold py-4 px-4 rounded-2xl shadow-lg border border-blue-400/30 flex items-center justify-center gap-2 whitespace-nowrap">
                    📡 開啟 GPS 並取得目前位置
                </button>
                <div id="gpsStatus" class="mt-3 text-base sm:text-lg text-amber-300 font-semibold bg-gray-900/80 p-3.5 rounded-2xl border border-gray-800 text-center shadow-inner">
                    ⚠️ 尚未取得 GPS 定位
                </div>
            </div>
        </section>

        <!-- 下拉選擇駐點 -->
        <div class="glass-card rounded-3xl p-4 border border-gray-800">
            <label for="locationSelect" class="block text-base sm:text-lg font-bold mb-2 text-gray-200">
                📍 選擇打卡駐點足跡：
            </label>
            <select id="locationSelect" onchange="onSelectLocationChange()" class="w-full bg-gray-900 text-cyan-300 font-bold border border-gray-700 rounded-2xl p-3.5 text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-cyan-500/50 shadow-inner">
                <!-- 動態載入 -->
            </select>
        </div>

        <!-- 目標距離顯示卡片 -->
        <div class="bg-gradient-to-r from-emerald-950/80 to-teal-950/80 border border-emerald-500/30 text-emerald-300 rounded-3xl p-4 shadow-xl text-center backdrop-blur-md">
            <div id="targetDistance" class="text-xl sm:text-3xl font-extrabold tracking-wider whitespace-nowrap overflow-hidden text-ellipsis">
                距離目標：-- 公里
            </div>
        </div>

        <!-- 地圖區域 -->
        <div class="w-full h-[65vh] sm:h-[70vh] rounded-3xl overflow-hidden map-container z-0 relative">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- 出發導航按鈕 -->
        <div>
            <a id="navGoBtn" href="#" target="_blank" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.98] transition-all text-white text-lg sm:text-xl font-bold py-4 px-4 rounded-2xl shadow-lg border border-emerald-400/30 flex items-center justify-center gap-2 text-center whitespace-nowrap">
                🚗 出發導航 (開啟 Google 地圖)
            </a>
        </div>

        <!-- 新增打卡區塊 -->
        <section class="glass-card rounded-3xl p-5 space-y-4">
            <h2 class="text-lg sm:text-xl font-bold text-cyan-300 flex items-center gap-2">
                ✍️ 新增旅遊駐點打卡
            </h2>

            <div class="space-y-2">
                <input type="text" id="locDesc" placeholder="請輸入景點名稱或說明..." class="w-full bg-gray-900/90 text-white border border-gray-700 focus:border-amber-400 rounded-2xl p-4 text-lg placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-amber-400/30 transition-all shadow-inner">
            </div>

            <div>
                <button onclick="saveCheckIn()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.98] transition-all text-white text-lg font-bold py-4 px-4 rounded-2xl shadow-lg border border-emerald-400/30 flex items-center justify-center gap-2 whitespace-nowrap">
                    💾 儲存目前位置打卡
                </button>
            </div>
        </section>

        <!-- 便利小工具區塊 -->
        <section class="glass-card rounded-3xl p-5 space-y-4">
            <h2 class="text-lg sm:text-xl font-bold text-amber-300">
                🛠️ 旅遊便利小工具
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="copyLineReport()" class="bg-gray-800 hover:bg-gray-700 active:scale-[0.98] transition-all text-amber-300 text-base font-bold py-3.5 px-3 rounded-2xl shadow border border-amber-500/20 flex items-center justify-center gap-2 whitespace-nowrap">
                    📋 複製 LINE 報平安
                </button>
                <button onclick="exportBackup()" class="bg-gray-800 hover:bg-gray-700 active:scale-[0.98] transition-all text-indigo-300 text-base font-bold py-3.5 px-3 rounded-2xl shadow border border-indigo-500/20 flex items-center justify-center gap-2 whitespace-nowrap">
                    📤 備份回憶資料
                </button>
                <button onclick="triggerImport()" class="bg-gray-800 hover:bg-gray-700 active:scale-[0.98] transition-all text-purple-300 text-base font-bold py-3.5 px-3 rounded-2xl shadow border border-purple-500/20 flex items-center justify-center gap-2 whitespace-nowrap sm:col-span-2">
                    📥 還原備份資料
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </section>

        <!-- 歷史打卡紀錄清單 -->
        <section class="glass-card rounded-3xl p-5 space-y-4">
            <button onclick="toggleHistoryWarehouse()" class="w-full bg-gradient-to-r from-purple-900/60 to-indigo-900/60 hover:from-purple-900/80 hover:to-indigo-900/80 active:scale-[0.98] transition-all text-purple-200 text-lg font-bold py-4 px-4 rounded-2xl shadow border border-purple-500/30 flex items-center justify-between whitespace-nowrap">
                <span>📦 詳細打卡紀錄列表</span>
                <span id="warehouseToggleText" class="text-amber-300 text-sm sm:text-base">[ 展開 🔽 ]</span>
            </button>
            
            <div id="historyWarehouseContainer" class="hidden space-y-3 pt-3 border-t border-purple-900/50">
                <div id="allRecordList" class="space-y-3">
                    <!-- 紀錄選單清單渲染區域 -->
                </div>
            </div>
        </section>

        <!-- 提示訊息 Modal -->
        <div id="msgModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-card rounded-3xl p-6 max-w-md w-full text-center shadow-2xl border border-gray-700">
                <p id="msgText" class="text-xl font-bold text-amber-300 mb-6 leading-relaxed"></p>
                <button onclick="closeModal()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-lg font-bold py-3.5 rounded-2xl shadow-lg border border-emerald-400/30 active:scale-[0.98]">
                    確定知道了 👍
                </button>
            </div>
        </div>

        <!-- 刪除確認 Modal -->
        <div id="deleteModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-card rounded-3xl p-6 max-w-md w-full text-center shadow-2xl border border-rose-500/30 space-y-6">
                <p class="text-xl font-bold text-rose-300">⚠️ 請問確定要刪除這筆回憶紀錄嗎？</p>
                <div class="flex gap-3">
                    <button onclick="closeDeleteModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-lg font-bold py-3.5 rounded-2xl shadow border border-gray-600 active:scale-[0.98]">
                        取消
                    </button>
                    <button id="confirmDeleteBtn" class="flex-1 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-lg font-bold py-3.5 rounded-2xl shadow border border-rose-400/30 active:scale-[0.98]">
                        確定刪除 🗑️
                    </button>
                </div>
            </div>
        </div>

        <footer class="text-center text-gray-500 text-sm pb-8">
            <p>❤️ 專為旅遊設計的安心足跡紀錄系統</p>
        </footer>
    </div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let allRecords = [];
        let pendingDeleteIndex = null;
        let map = null;
        let myMarker = null;       // 我的定位標記
        let targetMarker = null;   // 目標駐點標記

        window.onload = function() {
            initMap();
            loadData();
        };

        function initMap() {
            map = L.map('map').setView([22.6273, 120.3014], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; Leaflet | &copy; OpenStreetMap'
            }).addTo(map);
        }

        function showModal(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('senior_travel_all_records');
                if (saved) {
                    allRecords = JSON.parse(saved);
                } else {
                    const oldLatest = localStorage.getItem('senior_travel_latest');
                    const oldHistory = localStorage.getItem('senior_travel_history');
                    let temp = [];
                    if (oldLatest) temp = temp.concat(JSON.parse(oldLatest));
                    if (oldHistory) temp = temp.concat(JSON.parse(oldHistory));
                    if (temp.length > 0) allRecords = temp;
                }
            } catch (e) {
                console.error("載入資料失敗", e);
            }
            updateDropdownAndMap();
            renderRecordList();
        }

        function saveData() {
            try {
                localStorage.setItem('senior_travel_all_records', JSON.stringify(allRecords));
            } catch (e) {
                console.error("儲存資料失敗", e);
            }
        }

        function updateDropdownAndMap() {
            const selectEl = document.getElementById('locationSelect');
            selectEl.innerHTML = '';

            if (allRecords.length === 0) {
                const option = document.createElement('option');
                option.text = "⚠️ 尚未有打卡駐點紀錄";
                option.value = "";
                selectEl.add(option);
                document.getElementById('targetDistance').innerText = "距離目標：尚無紀錄";
                document.getElementById('navGoBtn').href = "#";
                return;
            }

            allRecords.forEach((item, index) => {
                const option = document.createElement('option');
                const isLatest = (index === 0) ? "【最新】" : "";
                option.text = `📍 ${isLatest} ${item.desc} (${item.time})`;
                option.value = index;
                selectEl.add(option);
            });

            selectEl.selectedIndex = 0;
            onSelectLocationChange();
        }

        function updateMapMarkers(targetLat, targetLng, targetDesc) {
            if (myMarker) map.removeLayer(myMarker);
            if (targetMarker) map.removeLayer(targetMarker);

            let groupLayers = [];

            if (currentLat !== null && currentLng !== null) {
                myMarker = L.marker([currentLat, currentLng]).addTo(map)
                    .bindPopup("📍 您的目前位置");
                groupLayers.push([currentLat, currentLng]);
            }

            if (targetLat !== null && targetLng !== null) {
                targetMarker = L.marker([targetLat, targetLng]).addTo(map)
                    .bindPopup(`📍 選擇的駐點：${targetDesc}`)
                    .openPopup();
                groupLayers.push([targetLat, targetLng]);
            }

            if (groupLayers.length > 1) {
                const bounds = L.latLngBounds(groupLayers);
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            } else if (groupLayers.length === 1) {
                map.setView(groupLayers[0], 16);
            }

            setTimeout(() => { map.invalidateSize(); }, 150);
        }

        function onSelectLocationChange() {
            const selectEl = document.getElementById('locationSelect');
            const idx = selectEl.value;

            if (idx === "" || !allRecords[idx]) return;

            const selected = allRecords[idx];
            const lat = selected.lat;
            const lng = selected.lng;

            document.getElementById('navGoBtn').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

            updateDistanceDisplay(lat, lng);
            updateMapMarkers(lat, lng, selected.desc);
        }

        function updateDistanceDisplay(targetLat, targetLng) {
            const distSpan = document.getElementById('targetDistance');
            if (currentLat !== null && currentLng !== null) {
                const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
                if (dist !== null) {
                    if (dist < 1) {
                        distSpan.innerText = `距離目標：${(dist * 1000).toFixed(0)} 公尺`;
                    } else {
                        distSpan.innerText = `距離目標：${dist.toFixed(2)} 公里`;
                    }
                }
            } else {
                distSpan.innerText = "距離目標：尚未取得 GPS 定位";
            }
        }

        function getGPSLocation() {
            const statusDiv = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                statusDiv.innerHTML = "❌ 您的瀏覽器不支援 GPS 定位";
                showModal("您的瀏覽器不支援 GPS 定位功能！");
                return;
            }

            statusDiv.innerHTML = `<span class="animate-spin-custom">📡</span> 正在搜尋衛星定位中，請稍候...`;
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    statusDiv.innerHTML = `✅ 已成功取得定位！<br><span class="text-sm text-gray-400">緯度: ${currentLat.toFixed(4)}, 經度: ${currentLng.toFixed(4)}</span>`;
                    
                    onSelectLocationChange();
                },
                (error) => {
                    console.error(error);
                    statusDiv.innerHTML = "❌ 無法取得 GPS 位置，請確認手機定位已開啟";
                    showModal("無法取得 GPS 位置！請檢查手機是否已授權瀏覽器存取定位。");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function saveCheckIn() {
            const descInput = document.getElementById('locDesc');
            const desc = descInput.value.trim();

            if (currentLat === null || currentLng === null) {
                showModal("請先點擊上方的「開啟 GPS 並取得目前位置」！");
                return;
            }

            if (!desc) {
                showModal("請輸入位置說明（例如：杉林衛生所）！");
                descInput.focus();
                return;
            }

            const now = new Date();
            const timeString = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newRecord = {
                id: Date.now(),
                desc: desc,
                lat: currentLat,
                lng: currentLng,
                time: timeString
            };

            allRecords.unshift(newRecord);
            saveData();
            updateDropdownAndMap();
            renderRecordList();
            descInput.value = '';
            showModal("🎉 打卡成功！最新駐點已更新！");
        }

        function renderRecordList() {
            const container = document.getElementById('allRecordList');
            if (allRecords.length === 0) {
                container.innerHTML = `<div class="p-5 bg-gray-900/60 rounded-2xl text-center text-gray-400 text-base">目前尚無歷史紀錄。</div>`;
                return;
            }

            container.innerHTML = allRecords.map((item, index) => {
                return `
                    <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 space-y-3 shadow">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-lg font-bold text-amber-300">📌 ${escapeHtml(item.desc)}</h3>
                            <span class="text-xs bg-gray-800 text-cyan-300 px-2.5 py-1 rounded-xl border border-cyan-500/20 whitespace-nowrap">${item.time}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="selectAndFocusMap(${index})" class="flex-1 bg-cyan-700 hover:bg-cyan-600 active:scale-[0.98] transition-all text-white text-base font-bold py-2.5 px-3 rounded-xl text-center border border-cyan-400/20 shadow whitespace-nowrap">
                                🗺️ 地圖定位
                            </button>
                            <button onclick="confirmDeleteRecord(${index})" class="bg-rose-800 hover:bg-rose-700 active:scale-[0.98] transition-all text-white text-base font-bold py-2.5 px-3.5 rounded-xl border border-rose-400/20 shadow whitespace-nowrap">
                                🗑️ 刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectAndFocusMap(index) {
            document.getElementById('locationSelect').value = index;
            onSelectLocationChange();
            window.scrollTo({ top: 150, behavior: 'smooth' });
        }

        function confirmDeleteRecord(index) {
            pendingDeleteIndex = index;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteIndex = null;
        }

        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (pendingDeleteIndex !== null) {
                allRecords.splice(pendingDeleteIndex, 1);
                saveData();
                updateDropdownAndMap();
                renderRecordList();
                showModal("🗑️ 該筆紀錄已刪除！");
            }
            closeDeleteModal();
        };

        function copyLineReport() {
            if (allRecords.length === 0) {
                showModal("目前沒有任何打卡紀錄可以複製！");
                return;
            }

            let reportText = "📍【旅遊平安回報與足跡】\n";
            const items = allRecords.slice(0, 5);
            items.forEach((item, idx) => {
                reportText += `${idx + 1}. ${item.desc} (${item.time})\n`;
                reportText += `   導航：https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}\n`;
            });
            reportText += "家人們不用擔心，我目前平安順利！❤️";

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(reportText).then(() => {
                    showModal("📋 已成功複製報平安足跡文字！可以直接貼到 LINE 傳給家人！");
                });
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allRecords));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `travel_footprint_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            showModal("📤 備份檔案已成功下載！");
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        allRecords = parsed;
                    } else if (parsed.latestRecords) {
                        allRecords = [...parsed.latestRecords, ...parsed.historyRecords];
                    }
                    saveData();
                    updateDropdownAndMap();
                    renderRecordList();
                    showModal("📥 備份資料還原成功！");
                } catch (err) {
                    showModal("❌ 解析備份檔案失敗！");
                }
            };
            reader.readAsText(file);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function toggleHistoryWarehouse() {
            const container = document.getElementById('historyWarehouseContainer');
            const toggleText = document.getElementById('warehouseToggleText');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                toggleText.innerText = '[ 收合 🔼 ]';
            } else {
                container.classList.add('hidden');
                toggleText.innerText = '[ 展開 🔽 ]';
            }
        }
    </script>
