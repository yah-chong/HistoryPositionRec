<!DOCTYPE html>
<html lang="zh-TW" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>旅遊專用足跡與打卡系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 1.25rem;
        }
        button, input, select {
            min-height: 56px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen px-4 py-6 font-sans">

    <div class="max-w-2xl mx-auto space-y-6">
        <!-- 標題 (黃框單行顯示) -->
        <header class="text-center bg-slate-900 border-4 border-amber-400 rounded-3xl p-5 shadow-2xl">
            <h1 class="text-xl sm:text-3xl font-black text-amber-300 whitespace-nowrap overflow-hidden text-ellipsis">
                📍 旅遊專用足跡與打卡系統
            </h1>
        </header>

        <!-- GPS 定位區塊 (藍框) -->
        <section class="bg-slate-900 border-4 border-blue-400 rounded-3xl p-5 shadow-2xl space-y-4">
            <div>
                <button onclick="getGPSLocation()" id="gpsBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-black py-4 px-4 rounded-2xl shadow-xl border-4 border-blue-300 flex items-center justify-center gap-2 whitespace-nowrap transition-transform active:scale-95">
                    📡 開啟 GPS 並取得目前位置
                </button>
                <div id="gpsStatus" class="mt-3 text-lg sm:text-xl text-amber-300 font-bold bg-slate-950 p-4 rounded-xl border-2 border-slate-800 text-center">
                    ⚠️ 尚未取得 GPS 定位
                </div>
            </div>
        </section>

        <!-- 地圖與導航檢視專區 -->
        <section class="bg-slate-900 border-4 border-slate-700 rounded-3xl p-5 shadow-2xl space-y-4">
            
            <!-- 選擇打卡駐點足跡下拉選單 -->
            <div class="bg-white text-gray-900 rounded-2xl p-4 shadow-md border-2 border-slate-300">
                <label for="locationSelect" class="block text-lg font-bold mb-2">
                    📍 選擇打卡駐點足跡：
                </label>
                <select id="locationSelect" onchange="onSelectLocationChange()" class="w-full bg-slate-50 text-blue-700 font-bold border-2 border-blue-400 rounded-xl p-3 text-lg focus:outline-none">
                    <!-- 動態載入 -->
                </select>
            </div>

            <!-- 目標距離顯示 (獨立換行) -->
            <div class="bg-emerald-100 text-emerald-950 rounded-2xl p-4 shadow-md border-l-8 border-emerald-600 space-y-1">
                <div class="text-base sm:text-lg font-black text-emerald-900">
                    📍 您與目標位置距離：
                </div>
                <div id="targetDistance" class="text-2xl sm:text-3xl font-black text-emerald-800 tracking-wider">
                    -- 公里
                </div>
            </div>

            <!-- Leaflet 地圖顯示區域 -->
            <div class="rounded-2xl overflow-hidden border-4 border-slate-700 shadow-inner">
                <div id="map" class="w-full h-72 z-0"></div>
            </div>

            <!-- 出發導航綠色按鈕 (單行顯示) -->
            <div>
                <a id="navGoBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-lg sm:text-2xl font-black py-4 px-4 rounded-2xl shadow-xl border-4 border-emerald-300 flex items-center justify-center gap-2 text-center whitespace-nowrap transition-transform active:scale-95">
                    🚗 出發導航 (開啟 Google 地圖)
                </a>
            </div>

        </section>

        <!-- 新增打卡區塊 -->
        <section class="bg-slate-900 border-4 border-cyan-400 rounded-3xl p-5 shadow-2xl space-y-4">
            <h2 class="text-xl sm:text-2xl font-black text-cyan-300">
                ✍️ 新增旅遊駐點打卡
            </h2>

            <div class="space-y-2">
                <input type="text" id="locDesc" placeholder="請輸入景點名稱或說明..." class="w-full bg-slate-950 text-white border-4 border-amber-400 rounded-2xl p-4 text-xl placeholder-slate-500 focus:outline-none">
            </div>

            <div>
                <button onclick="saveCheckIn()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xl font-black py-4 px-4 rounded-2xl shadow-xl border-4 border-emerald-300 flex items-center justify-center gap-2 whitespace-nowrap transition-transform active:scale-95">
                    💾 儲存目前位置打卡
                </button>
            </div>
        </section>

        <!-- 報平安與備份小工具區塊 -->
        <section class="bg-slate-900 border-4 border-amber-400 rounded-3xl p-5 shadow-2xl space-y-4">
            <h2 class="text-xl sm:text-2xl font-black text-amber-300">
                🛠️ 旅遊便利小工具
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="copyLineReport()" class="bg-amber-600 hover:bg-amber-500 text-white text-lg font-bold py-3 px-3 rounded-2xl shadow border-2 border-amber-300 flex items-center justify-center gap-2 whitespace-nowrap">
                    📋 複製 LINE 報平安
                </button>
                <button onclick="exportBackup()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-bold py-3 px-3 rounded-2xl shadow border-2 border-indigo-300 flex items-center justify-center gap-2 whitespace-nowrap">
                    📤 備份回憶資料
                </button>
                <button onclick="triggerImport()" class="bg-violet-600 hover:bg-violet-500 text-white text-lg font-bold py-3 px-3 rounded-2xl shadow border-2 border-violet-300 flex items-center justify-center gap-2 whitespace-nowrap sm:col-span-2">
                    📥 還原備份資料
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </section>

        <!-- 所有打卡紀錄清單管理 -->
        <section class="bg-slate-900 border-4 border-purple-400 rounded-3xl p-5 shadow-2xl space-y-4">
            <button onclick="toggleHistoryWarehouse()" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-xl font-black py-4 px-4 rounded-2xl shadow-xl border-4 border-purple-300 flex items-center justify-between whitespace-nowrap">
                <span>📦 詳細打卡紀錄列表</span>
                <span id="warehouseToggleText" class="text-amber-300 text-lg">[ 展開 🔽 ]</span>
            </button>
            
            <div id="historyWarehouseContainer" class="hidden space-y-4 pt-4 border-t-2 border-purple-800">
                <div id="allRecordList" class="space-y-4">
                    <!-- 紀錄選單清單渲染區域 -->
                </div>
            </div>
        </section>

        <!-- 彈窗與二次確認 -->
        <div id="msgModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border-4 border-amber-400 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl">
                <p id="msgText" class="text-2xl font-bold text-amber-300 mb-6"></p>
                <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-2xl font-black py-4 rounded-2xl shadow-lg border-2 border-emerald-400">
                    確定知道了 👍
                </button>
            </div>
        </div>

        <div id="deleteModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border-4 border-rose-500 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl space-y-6">
                <p class="text-2xl font-bold text-rose-300">⚠️ 請問確定要刪除這筆回憶紀錄嗎？</p>
                <div class="flex gap-4">
                    <button onclick="closeDeleteModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold py-4 rounded-2xl shadow-lg border-2 border-slate-500">
                        取消
                    </button>
                    <button id="confirmDeleteBtn" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xl font-bold py-4 rounded-2xl shadow-lg border-2 border-rose-400">
                        確定刪除 🗑️
                    </button>
                </div>
            </div>
        </div>

        <footer class="text-center text-slate-400 text-base pb-8">
            <p>❤️ 專為旅遊設計的安心足跡紀錄系統</p>
        </footer>
    </div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let allRecords = [];
        let pendingDeleteIndex = null;
        let map = null;
        let mapMarker = null;

        window.onload = function() {
            initMap();
            loadData();
        };

        function initMap() {
            map = L.map('map').setView([22.6273, 120.3014], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; Leaflet | &copy; OpenStreetMap'
            }).addTo(map);
        }

        function showModal(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('senior_travel_all_records');
                if (saved) {
                    allRecords = JSON.parse(saved);
                } else {
                    const oldLatest = localStorage.getItem('senior_travel_latest');
                    const oldHistory = localStorage.getItem('senior_travel_history');
                    let temp = [];
                    if (oldLatest) temp = temp.concat(JSON.parse(oldLatest));
                    if (oldHistory) temp = temp.concat(JSON.parse(oldHistory));
                    if (temp.length > 0) allRecords = temp;
                }
            } catch (e) {
                console.error("載入資料失敗", e);
            }
            updateDropdownAndMap();
            renderRecordList();
        }

        function saveData() {
            try {
                localStorage.setItem('senior_travel_all_records', JSON.stringify(allRecords));
            } catch (e) {
                console.error("儲存資料失敗", e);
            }
        }

        function updateDropdownAndMap() {
            const selectEl = document.getElementById('locationSelect');
            selectEl.innerHTML = '';

            if (allRecords.length === 0) {
                const option = document.createElement('option');
                option.text = "⚠️ 尚未有打卡駐點紀錄";
                option.value = "";
                selectEl.add(option);
                document.getElementById('targetDistance').innerText = "-- 公里";
                document.getElementById('navGoBtn').href = "#";
                return;
            }

            allRecords.forEach((item, index) => {
                const option = document.createElement('option');
                const isLatest = (index === 0) ? "【最新】" : "";
                option.text = `📍 ${isLatest} ${item.desc} (${item.time})`;
                option.value = index;
                selectEl.add(option);
            });

            selectEl.selectedIndex = 0;
            onSelectLocationChange();
        }

        function onSelectLocationChange() {
            const selectEl = document.getElementById('locationSelect');
            const idx = selectEl.value;

            if (idx === "" || !allRecords[idx]) return;

            const selected = allRecords[idx];
            const lat = selected.lat;
            const lng = selected.lng;
            map.setView([lat, lng], 16);

            if (mapMarker) {
                map.removeLayer(mapMarker);
            }
            mapMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`📍 駐點位置：${selected.desc}`)
                .openPopup();

            document.getElementById('navGoBtn').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            updateDistanceDisplay(lat, lng);
            setTimeout(() => { map.invalidateSize(); }, 150);
        }

        function updateDistanceDisplay(targetLat, targetLng) {
            const distSpan = document.getElementById('targetDistance');
            if (currentLat !== null && currentLng !== null) {
                const dist = calculateDistance(currentLat, currentLng, targetLat, targetLng);
                if (dist !== null) {
                    if (dist < 1) {
                        distSpan.innerText = `${(dist * 1000).toFixed(0)} 公尺`;
                    } else {
                        distSpan.innerText = `${dist.toFixed(2)} 公里`;
                    }
                }
            } else {
                distSpan.innerText = "尚未取得 GPS 定位";
            }
        }

        function getGPSLocation() {
            const statusDiv = document.getElementById('gpsStatus');
            if (!navigator.geolocation) {
                statusDiv.innerHTML = "❌ 您的瀏覽器不支援 GPS 定位";
                showModal("您的瀏覽器不支援 GPS 定位功能！");
                return;
            }

            statusDiv.innerHTML = `<span class="animate-spin-custom">📡</span> 正在搜尋衛星定位中，請稍候...`;
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    statusDiv.innerHTML = `✅ 已成功取得定位！<br><span class="text-base text-slate-300">緯度: ${currentLat.toFixed(4)}, 經度: ${currentLng.toFixed(4)}</span>`;
                    onSelectLocationChange();
                },
                (error) => {
                    console.error(error);
                    statusDiv.innerHTML = "❌ 無法取得 GPS 位置，請確認手機定位已開啟";
                    showModal("無法取得 GPS 位置！請檢查手機是否已授權瀏覽器存取定位。");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function saveCheckIn() {
            const descInput = document.getElementById('locDesc');
            const desc = descInput.value.trim();

            if (currentLat === null || currentLng === null) {
                showModal("請先點擊上方的「開啟 GPS 並取得目前位置」！");
                return;
            }

            if (!desc) {
                showModal("請輸入位置說明（例如：杉林衛生所）！");
                descInput.focus();
                return;
            }

            const now = new Date();
            const timeString = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newRecord = {
                id: Date.now(),
                desc: desc,
                lat: currentLat,
                lng: currentLng,
                time: timeString
            };

            allRecords.unshift(newRecord);
            saveData();
            updateDropdownAndMap();
            renderRecordList();
            descInput.value = '';
            showModal("🎉 打卡成功！最新駐點已更新！");
        }

        function renderRecordList() {
            const container = document.getElementById('allRecordList');
            if (allRecords.length === 0) {
                container.innerHTML = `<div class="p-6 bg-slate-950 rounded-2xl text-center text-slate-400 text-xl">目前尚無歷史紀錄。</div>`;
                return;
            }

            container.innerHTML = allRecords.map((item, index) => {
                return `
                    <div class="bg-slate-950 border-4 border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                        <div class="flex justify-between items-start">
                            <h3 class="text-xl font-black text-amber-300">📌 ${escapeHtml(item.desc)}</h3>
                            <span class="text-sm bg-slate-900 text-cyan-300 px-3 py-1 rounded-xl border border-cyan-700">${item.time}</span>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="selectAndFocusMap(${index})" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white text-lg font-bold py-3 px-3 rounded-xl text-center border-2 border-cyan-300 shadow whitespace-nowrap">
                                🗺️ 地圖定位
                            </button>
                            <button onclick="confirmDeleteRecord(${index})" class="bg-rose-700 hover:bg-rose-600 text-white text-lg font-bold py-3 px-4 rounded-xl border-2 border-rose-400 shadow whitespace-nowrap">
                                🗑️ 刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectAndFocusMap(index) {
            document.getElementById('locationSelect').value = index;
            onSelectLocationChange();
            window.scrollTo({ top: 150, behavior: 'smooth' });
        }

        function confirmDeleteRecord(index) {
            pendingDeleteIndex = index;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteIndex = null;
        }

        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (pendingDeleteIndex !== null) {
                allRecords.splice(pendingDeleteIndex, 1);
                saveData();
                updateDropdownAndMap();
                renderRecordList();
                showModal("🗑️ 該筆紀錄已刪除！");
            }
            closeDeleteModal();
        };

        function copyLineReport() {
            if (allRecords.length === 0) {
                showModal("目前沒有任何打卡紀錄可以複製！");
                return;
            }

            let reportText = "📍【旅遊平安回報與足跡】\n";
            const items = allRecords.slice(0, 5);
            items.forEach((item, idx) => {
                reportText += `${idx + 1}. ${item.desc} (${item.time})\n`;
                reportText += `   導航：https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}\n`;
            });
            reportText += "家人們不用擔心，我目前平安順利！❤️";

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(reportText).then(() => {
                    showModal("📋 已成功複製報平安足跡文字！可以直接貼到 LINE 傳給家人！");
                });
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allRecords));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `travel_footprint_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            showModal("📤 備份檔案已成功下載！");
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        allRecords = parsed;
                    } else if (parsed.latestRecords) {
                        allRecords = [...parsed.latestRecords, ...parsed.historyRecords];
                    }
                    saveData();
                    updateDropdownAndMap();
                    renderRecordList();
                    showModal("📥 備份資料還原成功！");
                } catch (err) {
                    showModal("❌ 解析備份檔案失敗！");
                }
            };
            reader.readAsText(file);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function toggleHistoryWarehouse() {
            const container = document.getElementById('historyWarehouseContainer');
            const toggleText = document.getElementById('warehouseToggleText');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                toggleText.innerText = '[ 收合 🔼 ]';
            } else {
                container.classList.add('hidden');
                toggleText.innerText = '[ 展開 🔽 ]';
            }
        }
    </script>
</body>
</html>
